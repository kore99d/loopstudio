<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>LoopStudio — sequenciador de loops</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#e9ecf0;--pn:#fff;--ln:#d3d8df;--tx:#1b1f26;--mu:#5c6674;--g1:#eef0f3;--g2:#d9dee5;--ph:#d6263b;--hv:#e3e8ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--pn:#1a1e26;--ln:#2b313b;--tx:#e6e9ee;--mu:#8b95a3;--g1:#161a21;--g2:#2a303a;--ph:#ff5468;--hv:#262c36}}
:root[data-theme="dark"]{--bg:#101319;--pn:#1a1e26;--ln:#2b313b;--tx:#e6e9ee;--mu:#8b95a3;--g1:#161a21;--g2:#2a303a;--ph:#ff5468;--hv:#262c36}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 'Schibsted Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--hv);border:1px solid var(--ln);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--mu)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ph);outline-offset:1px}
input,select{background:var(--g1);border:1px solid var(--ln);border-radius:6px;padding:4px 6px}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
h1{font-size:16px;margin:0 6px 0 0;font-weight:700}
label{display:flex;gap:6px;align-items:center;color:var(--mu)}
#play{background:var(--ph);color:#fff;border-color:transparent;font-weight:700;min-width:84px}
#clock{font:600 18px/1 ui-monospace,monospace;min-width:76px}
#st{color:var(--mu);margin-left:auto}
main{flex:1;display:flex;min-height:0}
aside{width:210px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
aside h2{font-size:13px;margin:0;color:var(--mu);font-weight:600}
.lp{display:flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:6px;padding:6px;cursor:grab;background:var(--g1)}
.lp.on{outline:2px solid var(--ph)}.lp b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp small{color:var(--mu);display:block;font-weight:400}.lp button{padding:2px 7px}
#drop{border:1px dashed var(--ln);border-radius:6px;padding:10px;text-align:center;color:var(--mu);cursor:pointer}
#drop.over{border-color:var(--ph);color:var(--tx)}
#tl{flex:1;overflow:auto;position:relative;min-width:0}
#in{position:relative;width:max-content;min-width:100%}
.row{display:flex;width:max-content;min-width:100%;border-bottom:1px solid var(--ln)}
.hd{position:sticky;left:0;z-index:3;width:150px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:6px 8px;display:flex;flex-direction:column;gap:5px;height:68px}
.hd .r{display:flex;gap:4px;align-items:center}.hd input[type=text]{width:100%;min-width:0;border-color:transparent;background:transparent;font-weight:600;padding:1px 2px}
.hd input[type=range]{width:70px;padding:0}.hd button{padding:1px 7px;font-size:12px}.hd button.on{background:var(--ph);color:#fff;border-color:transparent}
.lane{position:relative;height:68px;flex:none;background-image:linear-gradient(90deg,var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--mu) 1px,transparent 1px);background-size:var(--ppb) 100%,calc(var(--ppb)*4) 100%;background-color:var(--g1);background-blend-mode:normal;cursor:copy}
.lane.arm{cursor:copy}.lane:not(.arm){cursor:default}
.ruler{height:24px;position:sticky;top:0;z-index:5;background:var(--pn);cursor:pointer}
.ruler .hd{height:24px;padding:0 8px;justify-content:center;color:var(--mu);font-size:12px}
.ruler .lane{height:24px;background-image:linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:calc(var(--ppb)*4) 100%;background-color:var(--pn);cursor:pointer}
.ruler span{position:absolute;top:4px;font-size:11px;color:var(--mu);padding-left:4px}
.clip{position:absolute;top:5px;height:58px;border-radius:5px;overflow:hidden;color:#fff;font-size:11px;font-weight:600;cursor:grab;border:1px solid rgba(0,0,0,.35);touch-action:none;user-select:none}
.clip.sel{outline:2px solid var(--tx);z-index:2}.clip canvas{position:absolute;inset:0;width:100%;height:100%}
.clip i{position:relative;font-style:normal;padding:2px 5px;display:block;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ph);z-index:6;pointer-events:none}
.add{margin:8px;position:sticky;left:8px}
#insp{background:var(--pn);border-top:1px solid var(--ln);padding:8px 12px;min-height:46px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--mu)}
#insp b{color:var(--tx)}#insp input[type=number]{width:62px}
@media (max-width:720px){main{flex-direction:column}aside{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);flex:none}.lp{min-width:150px}aside h2{display:none}#drop{min-width:110px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header>
<h1>LoopStudio</h1>
<button id="play" onclick="play()">▶ Tocar</button><span id="clock">001.1</span>
<label>BPM <input id="bpm" type="number" min="40" max="220" value="120" style="width:64px" onchange="setP('bpm',+this.value)"></label>
<label>Tom <select id="key" onchange="setP('key',+this.value)"></select></label>
<label>Compassos <input id="bars" type="number" min="4" max="64" value="16" style="width:64px" onchange="setP('bars',+this.value)"></label>
<label>Zoom <input id="zoom" type="range" min="8" max="60" value="22" oninput="S.zoom=+this.value;render()"></label>
<button onclick="exportMix()">Exportar WAV</button><span id="st">Pronto</span>
</header>
<main>
<aside id="lib"></aside>
<div id="tl"><div id="in"></div></div>
</main>
<div id="insp">Clique num loop da biblioteca e depois numa trilha, ou arraste-o para a linha do tempo.</div>
<script>
const AC=new(window.AudioContext||window.webkitAudioContext)(),SR=AC.sampleRate;
const K=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],COL=['#d9762f','#2f9e8f','#6a79e6','#cc4f7e','#7fb02f','#c9a21f'];
const S={bpm:120,key:-1,bars:16,zoom:22,pos:0,armed:null,sel:null,tracks:[],loops:[]};
let uid=1,live=null;const cache=new Map(),$=s=>document.querySelector(s),msg=t=>$('#st').textContent=t,tick=()=>new Promise(r=>setTimeout(r,20));
$('#key').innerHTML='<option value="-1">Livre (sem ajuste)</option>'+K.map((k,i)=>`<option value="${i}">${k}</option>`).join('');
const L=id=>S.loops.find(l=>l.id==id),HW=150;
const auto=l=>(S.key<0||l.key<0)?0:((S.key-l.key+6)%12+12)%12-6,semis=c=>auto(L(c.loop))+c.semi;
const clipById=id=>{for(const t of S.tracks){const c=t.clips.find(c=>c.id==id);if(c)return[t,c]}return[]};

/* ---------- Time-stretch + pitch-shift (síntese granular OLA) ---------- */
const N=2048,H=512,W=Float32Array.from({length:N},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/N));
function stretch(l,bpm,st){
 const k=`${l.id}|${bpm}|${st}`;if(cache.has(k))return cache.get(k);
 const src=l.buf,n=src.length,out_=Math.round(l.beats*60/bpm*SR),p=2**(st/12),r=n/out_,out=AC.createBuffer(src.numberOfChannels,out_,SR);
 for(let c=0;c<src.numberOfChannels;c++){const x=src.getChannelData(c),y=out.getChannelData(c);
  if(!st&&Math.abs(r-1)<1e-4){y.set(x.subarray(0,Math.min(n,out_)));continue}
  for(let o=-N;o<out_;o+=H){const a=o*r;for(let i=0;i<N;i++){const oi=o+i;if(oi<0||oi>=out_)continue;let s=(a+i*p)%n;if(s<0)s+=n;const i0=s|0,f=s-i0;y[oi]+=(x[i0]*(1-f)+x[(i0+1)%n]*f)*W[i]*.5}}}
 cache.set(k,out);return out}

/* ---------- Loops de demonstração (sintetizados) ---------- */
function mk(d8){const b=AC.createBuffer(1,Math.round(4*SR),SR);d8(b.getChannelData(0));return b}
function tone(d,t0,dur,f,a,dec){const s=Math.round(t0*SR),n=Math.round(dur*SR);for(let i=0;i<n&&s+i<d.length;i++){const t=i/SR;d[s+i]+=(Math.sin(6.2832*f*t)+.4*Math.sin(12.566*f*t)+.2*Math.sin(18.85*f*t))*a*Math.min(1,i/150)*Math.exp(-t*dec)}}
function noise(d,t0,dur,a,dec,hp){const s=Math.round(t0*SR),n=Math.round(dur*SR);let l=0;for(let i=0;i<n&&s+i<d.length;i++){const w=Math.random()*2-1;d[s+i]+=(hp?w-l:w)*a*Math.exp(-i/SR*dec);l=w}}
function demo(){
 const drums=mk(d=>{for(let b=0;b<8;b++){const s=Math.round(b*.5*SR);for(let i=0;i<.3*SR&&s+i<d.length;i++){const t=i/SR;d[s+i]+=Math.sin(6.2832*(48*t+(110/28)*(1-Math.exp(-28*t))))*.9*Math.exp(-t*9)}
  if(b%2){noise(d,b*.5,.25,.5,22,0);tone(d,b*.5,.15,190,.2,25)}noise(d,b*.5,.08,.22,70,1);noise(d,b*.5+.25,.08,.16,70,1)}});
 const bass=mk(d=>{[55,55,65.41,49,55,55,65.41,82.41].forEach((f,i)=>tone(d,i*.5,.46,f,.5,3))});
 const pad=mk(d=>{[[110,130.8,164.8],[87.3,110,130.8]].forEach((ch,j)=>ch.forEach(f=>tone(d,j*2,2,f,.12,.7)))});
 const lead=mk(d=>{const sc=[440,523.25,587.33,659.25,783.99],pt=[0,2,3,2,1,3,4,3];for(let i=0;i<32;i++)tone(d,i*.125,.12,sc[pt[i%8]],.16,16)});
 addLoop('Bateria',drums,8,-1);addLoop('Baixo (Lá)',bass,8,9);addLoop('Acordes (Lá m)',pad,8,9);addLoop('Arpejo (Lá m)',lead,8,9)}
function addLoop(name,buf,beats,key){const d=buf.getChannelData(0),pk=new Float32Array(256),sz=Math.ceil(d.length/256);for(let i=0;i<256;i++){let m=0;for(let j=i*sz;j<Math.min(d.length,(i+1)*sz);j++)m=Math.max(m,Math.abs(d[j]));pk[i]=m}
 const mx=Math.max(...pk)||1;for(let i=0;i<256;i++)pk[i]/=mx;const l={id:uid++,name,buf,beats,key,peaks:pk};S.loops.push(l);return l}
function addTrack(name){const t={id:uid++,name:name||'Trilha '+(S.tracks.length+1),vol:.8,mute:0,solo:0,clips:[]};S.tracks.push(t);return t}
function addClip(t,l,start){const c={id:uid++,loop:l.id,start:Math.max(0,start),semi:0};t.clips.push(c);S.sel=c.id;return c}

/* ---------- Motor de áudio ---------- */
function schedule(ctx,from,dest,t0,gains){
 const spb=60/S.bpm,fr=from*spb,solo=S.tracks.some(t=>t.solo),srcs=[];
 S.tracks.forEach(t=>{const g=ctx.createGain();g.gain.value=(t.mute||(solo&&!t.solo))?0:t.vol;g.connect(dest);if(gains)gains[t.id]=g;
  t.clips.forEach(c=>{const b=stretch(L(c.loop),S.bpm,semis(c)),ts=c.start*spb;if(ts+b.duration<=fr)return;
   const s=ctx.createBufferSource();s.buffer=b;s.connect(g);s.start(t0+Math.max(ts-fr,0),Math.max(fr-ts,0));srcs.push(s)})});return srcs}
function applyGains(){if(!live)return;const solo=S.tracks.some(t=>t.solo);S.tracks.forEach(t=>{const g=live.gains[t.id];if(g)g.gain.value=(t.mute||(solo&&!t.solo))?0:t.vol})}
async function play(){
 if(live)return stop();await AC.resume();msg('Processando loops…');await tick();
 const m=AC.createGain();m.gain.value=.9;m.connect(AC.destination);const gains={},t0=AC.currentTime+.08,srcs=schedule(AC,S.pos,m,t0,gains);
 live={t0,from:S.pos,m,gains,srcs};$('#play').textContent='■ Parar';msg('Tocando');anim()}
function stop(){if(!live)return;live.srcs.forEach(s=>{try{s.stop()}catch{}});live.m.disconnect();S.pos=live.from;live=null;$('#play').textContent='▶ Tocar';msg('Pronto');ph(S.pos)}
function anim(){if(!live)return;const b=live.from+Math.max(0,AC.currentTime-live.t0)*S.bpm/60;if(b>=S.bars*4)return stop();ph(b);
 const px=b*S.zoom,tl=$('#tl');if(px>tl.scrollLeft+tl.clientWidth-HW-30)tl.scrollLeft=px-20;requestAnimationFrame(anim)}
function ph(b){const e=$('#ph');if(e)e.style.left=(HW+b*S.zoom)+'px';$('#clock').textContent=String(Math.floor(b/4)+1).padStart(3,'0')+'.'+(Math.floor(b%4)+1)}
function setP(k,v){stop();if(k=='bpm')v=Math.min(220,Math.max(40,v||120));if(k=='bars')v=Math.min(64,Math.max(4,v||16));S[k]=v;$('#bpm').value=S.bpm;$('#bars').value=S.bars;render()}

/* ---------- Exportação ---------- */
function wav(b){const n=b.length,d=new DataView(new ArrayBuffer(44+n*4)),c=[b.getChannelData(0),b.getChannelData(1)];let pk=0;c.forEach(x=>{for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(x[i]))});const g=pk>.98?.98/pk:1,w=(o,s)=>[...s].forEach((q,i)=>d.setUint8(o+i,q.charCodeAt(0)));
 w(0,'RIFF');d.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);d.setUint32(24,SR,true);d.setUint32(28,SR*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*4,true);
 let o=44;for(let i=0;i<n;i++)for(let k=0;k<2;k++){d.setInt16(o,Math.max(-1,Math.min(1,c[k][i]*g))*32767,true);o+=2}return new Uint8Array(d.buffer)}
function crc(u){let t=crc.t;if(!t){t=crc.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t.push(c>>>0)}}let r=-1;for(let i=0;i<u.length;i++)r=t[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(name,data){const nb=new TextEncoder().encode(name),cc=crc(data),n=data.length,L=new DataView(new ArrayBuffer(30)),C=new DataView(new ArrayBuffer(46)),E=new DataView(new ArrayBuffer(22));
 L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint32(14,cc,true);L.setUint32(18,n,true);L.setUint32(22,n,true);L.setUint16(26,nb.length,true);
 C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint32(16,cc,true);C.setUint32(20,n,true);C.setUint32(24,n,true);C.setUint16(28,nb.length,true);
 E.setUint32(0,0x06054b50,true);E.setUint16(8,1,true);E.setUint16(10,1,true);E.setUint32(12,46+nb.length,true);E.setUint32(16,30+nb.length+n,true);return new Blob([L,nb,data,C,nb,E])}
async function exportMix(){
 stop();msg('Renderizando mixagem…');await tick();
 const len=Math.ceil((S.bars*4*60/S.bpm+.3)*SR),ctx=new OfflineAudioContext(2,len,SR),m=ctx.createGain();m.gain.value=.9;m.connect(ctx.destination);schedule(ctx,0,m,0);
 const w=wav(await ctx.startRendering()),name=`mix-${S.bpm}bpm.wav`,d=window.claude&&await window.claude.use('downloads');
 try{if(window.__TAURI__&&window.__TAURI__.dialog){const p=await window.__TAURI__.dialog.save({defaultPath:name,filters:[{name:'WAV',extensions:['wav']}]});if(!p){msg('Exportação cancelada');return}await window.__TAURI__.fs.writeFile(p,w);msg('WAV exportado');return}if(d){await d.save({filename:name.replace('.wav','.zip'),data:zip(name,w)});msg('Exportado: ZIP com o WAV')}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([w],{type:'audio/wav'}));a.download=name;a.click();msg('WAV exportado')}}catch(e){msg(e&&e.code=='declined'?'Exportação cancelada':'Falha ao exportar')}}

/* ---------- Importação ---------- */
async function imp(files){for(const f of files){try{const b=await AC.decodeAudioData(await f.arrayBuffer()),m=f.name.match(/(\d{2,3})\s*bpm/i),
 beats=m?Math.max(1,Math.round(b.duration*m[1]/60)):[1,2,4,8,16,32,64].reduce((a,x)=>Math.abs(Math.log(x*60/b.duration/120))<Math.abs(Math.log(a*60/b.duration/120))?x:a);
 addLoop(f.name.replace(/\.[^.]+$/,''),b,beats,-1)}catch{msg('Não foi possível ler '+f.name)}}render()}

/* ---------- Interface ---------- */
function render(){
 const ppb=S.zoom,Wd=S.bars*4*ppb,tl=$('#in');tl.style.setProperty('--ppb',ppb+'px');
 $('#lib').innerHTML='<h2>Biblioteca de loops</h2>'+S.loops.map(l=>`<div class="lp${S.armed==l.id?' on':''}" draggable="true" data-l="${l.id}"><b>${l.name}<small>${(l.beats*60/l.buf.duration).toFixed(0)} BPM · ${l.key<0?'sem tom':K[l.key]}</small></b><button data-pv="${l.id}" title="Ouvir">▶</button></div>`).join('')+'<div id="drop" tabindex="0">Importar áudio<br><small>clique ou solte arquivos aqui</small></div><input id="fi" type="file" accept="audio/*" multiple hidden>';
 let h=`<div class="row ruler"><div class="hd">Compassos</div><div class="lane" id="rl" style="width:${Wd}px">${Array.from({length:S.bars},(_,i)=>`<span style="left:${i*4*ppb}px">${i+1}</span>`).join('')}</div></div>`;
 S.tracks.forEach((t,i)=>{h+=`<div class="row"><div class="hd"><div class="r"><input type="text" value="${t.name}" aria-label="Nome da trilha" oninput="S.tracks[${i}].name=this.value"><button onclick="delT(${i})" title="Remover trilha">×</button></div><div class="r"><button class="${t.mute?'on':''}" onclick="T(${i},'mute')">M</button><button class="${t.solo?'on':''}" onclick="T(${i},'solo')">S</button><input type="range" min="0" max="1" step=".01" value="${t.vol}" aria-label="Volume" oninput="S.tracks[${i}].vol=+this.value;applyGains()"></div></div><div class="lane${S.armed?' arm':''}" data-t="${i}" style="width:${Wd}px">${t.clips.map(c=>{const l=L(c.loop),s=semis(c);return`<div class="clip${S.sel==c.id?' sel':''}" data-c="${c.id}" style="left:${c.start*ppb}px;width:${l.beats*ppb}px;background:${COL[i%COL.length]}"><canvas></canvas><i>${l.name}${s?` (${s>0?'+':''}${s} st)`:''}</i></div>`}).join('')}</div></div>`});
 h+='<button class="add" onclick="addTrack();render()">+ Adicionar trilha</button><div id="ph"></div>';tl.innerHTML=h;
 tl.querySelectorAll('.clip').forEach(e=>{const[,c]=clipById(e.dataset.c),l=L(c.loop),cv=e.querySelector('canvas'),w=cv.width=Math.max(8,l.beats*ppb),ht=cv.height=58,x=cv.getContext('2d');x.fillStyle='rgba(255,255,255,.55)';
  for(let i=0;i<w;i+=2){const v=l.peaks[Math.floor(i/w*256)]*ht*.42;x.fillRect(i,ht/2+6-v,1.5,v*2)}});
 ph(S.pos);insp()}
function insp(){const[t,c]=clipById(S.sel),e=$('#insp');if(!c){e.textContent='Clique num loop da biblioteca e depois numa trilha, ou arraste-o para a linha do tempo.';return}
 const l=L(c.loop),a=auto(l);e.innerHTML=`<b>${l.name}</b><span>Original: ${(l.beats*60/l.buf.duration).toFixed(1)} BPM → projeto ${S.bpm} BPM</span>
 <label>Batidas do loop <input type="number" min="1" max="128" value="${l.beats}" onchange="l_(${l.id},'beats',+this.value)"></label>
 <label>Tom do loop <select onchange="l_(${l.id},'key',+this.value)"><option value="-1">sem tom</option>${K.map((k,i)=>`<option value="${i}"${l.key==i?' selected':''}>${k}</option>`).join('')}</select></label>
 <label>Ajuste fino <button onclick="adj(-1)">−</button><b>${c.semi>0?'+':''}${c.semi} st</b><button onclick="adj(1)">+</button></label><span>Transposição total: ${a+c.semi} st</span>
 <button onclick="dup()">Duplicar</button><button onclick="del()">Excluir</button>`}
function l_(id,k,v){stop();const l=L(id);l[k]=k=='beats'?Math.max(1,v||1):v;cache.clear();render()}
function adj(d){const[,c]=clipById(S.sel);c.semi=Math.max(-12,Math.min(12,c.semi+d));render()}
function del(){const[t,c]=clipById(S.sel);if(!c)return;stop();t.clips=t.clips.filter(x=>x!==c);S.sel=null;render()}
function dup(){const[t,c]=clipById(S.sel);if(!c)return;stop();const n=addClip(t,L(c.loop),c.start+L(c.loop).beats);n.semi=c.semi;render()}
function T(i,k){const t=S.tracks[i];t[k]=t[k]?0:1;if(k=='solo'&&t.solo)S.tracks.forEach((q,j)=>{});applyGains();render()}
function delT(i){stop();S.tracks.splice(i,1);render()}
async function prev(id){stop();await AC.resume();const l=L(id),s=AC.createBufferSource();s.buffer=stretch(l,S.bpm,auto(l));s.connect(AC.destination);s.start()}
const tlEl=$('#tl'),beatAt=(e,lane)=>Math.max(0,Math.min(S.bars*4-1,Math.round((e.clientX-lane.getBoundingClientRect().left)/S.zoom)));
const lib=$('#lib');
lib.addEventListener('click',e=>{const pv=e.target.closest('[data-pv]');if(pv)return prev(pv.dataset.pv);const lp=e.target.closest('.lp');if(lp){S.armed=S.armed==lp.dataset.l?null:+lp.dataset.l;return render()}if(e.target.closest('#drop'))$('#fi').click()});
lib.addEventListener('change',e=>{if(e.target.id=='fi')imp(e.target.files)});
lib.addEventListener('dragstart',e=>{const lp=e.target.closest('.lp');if(lp)e.dataTransfer.setData('text/plain','loop:'+lp.dataset.l)});
lib.addEventListener('dragover',e=>{if(e.target.closest('#drop')){e.preventDefault();e.target.closest('#drop').classList.add('over')}});
lib.addEventListener('dragleave',e=>e.target.closest('#drop')?.classList.remove('over'));
lib.addEventListener('drop',e=>{if(e.target.closest('#drop')){e.preventDefault();imp(e.dataTransfer.files)}});
tlEl.addEventListener('dragover',e=>{if(e.target.closest('.lane[data-t]'))e.preventDefault()});
tlEl.addEventListener('drop',e=>{const ln=e.target.closest('.lane[data-t]'),d=e.dataTransfer.getData('text/plain');if(!ln||!d.startsWith('loop:'))return;e.preventDefault();stop();addClip(S.tracks[ln.dataset.t],L(d.slice(5)),beatAt(e,ln));render()});
tlEl.addEventListener('pointerdown',e=>{
 const rl=e.target.closest('#rl');if(rl){stop();S.pos=beatAt(e,rl);return ph(S.pos)}
 const ce=e.target.closest('.clip');
 if(ce){const[t0,c]=clipById(ce.dataset.c),x0=e.clientX,s0=c.start;let moved=0;S.sel=c.id;tlEl.querySelectorAll('.clip').forEach(q=>q.classList.toggle('sel',q==ce));insp();ce.setPointerCapture(e.pointerId);
  const mv=ev=>{moved=1;c.start=Math.max(0,Math.min(S.bars*4-1,s0+Math.round((ev.clientX-x0)/S.zoom)));ce.style.left=c.start*S.zoom+'px'},
  up=ev=>{ce.removeEventListener('pointermove',mv);ce.removeEventListener('pointerup',up);if(!moved)return;stop();const ln=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.lane[data-t]'),t1=ln&&S.tracks[ln.dataset.t];if(t1&&t1!==t0){t0.clips=t0.clips.filter(q=>q!==c);t1.clips.push(c)}render()};
  ce.addEventListener('pointermove',mv);ce.addEventListener('pointerup',up);return}
 const ln=e.target.closest('.lane[data-t]');
 if(ln&&S.armed){stop();addClip(S.tracks[ln.dataset.t],L(S.armed),beatAt(e,ln));render()}else if(ln){S.sel=null;render()}});
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.code=='Space'){e.preventDefault();play()}if(e.code=='Delete'||e.code=='Backspace')del()});

demo();['Bateria','Baixo','Acordes','Arpejo'].forEach(n=>addTrack(n));
for(let b=0;b<64;b+=8)addClip(S.tracks[0],S.loops[0],b);
for(let b=16;b<64;b+=8)addClip(S.tracks[1],S.loops[1],b);
for(let b=8;b<64;b+=8)addClip(S.tracks[2],S.loops[2],b);
for(let b=32;b<64;b+=8)addClip(S.tracks[3],S.loops[3],b);
S.sel=null;render();
</script></body></html>
