[package]
name = "loopstudio"
version = "0.1.0"
description = "Sequenciador de loops de código aberto"
edition = "2021"
license = "MIT"

[lib]
name = "loopstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
